<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2328">
<title>VGP Engins de chantier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f4f1; --card:#ffffff; --ink:#1f2328; --muted:#5f6368; --line:#d9d9d4;
  --accent:#f2b705; --accent-ink:#1f2328; --dark:#1f2328;
  --ok:#1e7d32; --ok-bg:#e6f4e8; --nc:#c62828; --nc-bg:#fdeaea; --so:#5f6368; --so-bg:#ececec;
  --warn:#b26a00; --warn-bg:#fff3d6;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px}
header.top .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--dark);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:transparent;border:1px solid #555;color:#fff;border-radius:8px;padding:8px 12px;min-height:42px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
.banner{background:var(--warn-bg);color:#5a3a00;border:1px solid #f0d58a;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:#d9a300;color:var(--accent-ink)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{color:var(--nc);border-color:#efb5b5}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.retard b{color:var(--nc)} .stat.bientot b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.mcard:active{background:#fafaf5}
.mcard .t{font-weight:700;font-size:16px}
.mcard .s{color:var(--muted);font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-retard{background:var(--nc-bg);color:var(--nc)}
.b-bientot{background:var(--warn-bg);color:var(--warn)} .b-jamais{background:var(--so-bg);color:#333}
.b-lev{background:#fff1c2;color:#6b4e00} .b-draft{background:#e3ecff;color:#1d4ed8}
.b-inapte{background:var(--nc);color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);flex:1;min-width:200px}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:16px;border:1px solid #c8c8c2;border-radius:8px;padding:10px;min-height:46px;background:#fff;width:100%}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:16px;min-height:46px}
.check input{width:24px;height:24px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:220px;border:1px solid #c8c8c2;border-radius:8px;padding:10px;min-height:46px;background:#fff}
.secnav{position:sticky;top:56px;z-index:15;background:var(--bg);padding:8px 0;display:flex;gap:8px;overflow-x:auto;margin-bottom:6px}
.secnav a{flex:none;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.secnav a.done{background:var(--ok-bg);border-color:#b7dfbd}
.secnav a.hasnc{background:var(--nc-bg);border-color:#f1b9b9}
.item{border-top:1px solid #ecece8;padding:10px 0}
.item:first-of-type{border-top:0}
.item .lbl{font-size:16px;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg button{min-width:64px;min-height:46px;border-radius:8px;border:1px solid #c8c8c2;background:#fff;font-weight:700;cursor:pointer}
.seg button.on.C{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.NC{background:var(--nc);border-color:var(--nc);color:#fff}
.seg button.on.SO{background:var(--so);border-color:var(--so);color:#fff}
.seg button .stl{font-weight:500;font-size:14px}
.seg button{padding:0 12px}
.seg .aux{min-width:auto;padding:0 12px;font-weight:600;color:var(--muted)}
.obs{margin-top:8px;width:100%;border:1px solid #c8c8c2;border-radius:8px;padding:10px;min-height:46px}
.item.isnc .obs{border-color:var(--nc)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .ph{position:relative}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos .ph button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--nc);color:#fff;font-weight:700;cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
table.t th{background:#f3f3ee;font-weight:600}
table.t input,table.t select{width:100%;min-width:70px;border:1px solid #c8c8c2;border-radius:6px;padding:8px;min-height:42px;background:#fff}
.scroll{overflow-x:auto}
.calc{font-weight:700}
.calc.ok{color:var(--ok)} .calc.nc{color:var(--nc)} .calc.warn{color:var(--warn)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.sigwrap{border:1px dashed #9a9a94;border-radius:8px;background:#fff;position:relative}
.sigwrap canvas{display:block;width:100%;height:180px;touch-action:none}
.sigwrap .ph{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;pointer-events:none;font-size:14px}
.radio-big{display:flex;gap:10px;flex-wrap:wrap}
.radio-big label{flex:1;min-width:180px;border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;display:flex;gap:10px;align-items:flex-start}
.radio-big input{width:22px;height:22px;margin-top:2px}
.radio-big label.sel-apte{border-color:var(--ok);background:var(--ok-bg)}
.radio-big label.sel-reserves{border-color:var(--warn);background:var(--warn-bg)}
.radio-big label.sel-inapte{border-color:var(--nc);background:var(--nc-bg)}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:flex-end;z-index:25}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:480px;width:100%;padding:20px}
.modal p{margin:0 0 16px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.hist{width:100%;border-collapse:collapse}
.hist td{padding:10px 6px;border-top:1px solid #ecece8}
.ref{font-size:13px;color:var(--muted)}
/* ---------- Rapport ---------- */
.report{background:#fff;color:#000;max-width:800px;margin:0 auto;padding:24px;border:1px solid var(--line);font-size:13px}
.report h1{font-size:20px;margin:0 0 4px}
.report h2{font-size:15px;margin:18px 0 6px;padding:4px 8px;background:#eee;border-left:4px solid var(--accent)}
.report table{width:100%;border-collapse:collapse;margin-bottom:6px}
.report th,.report td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
.report th{background:#f2f2f2}
.report table.chk{table-layout:fixed}.report table.chk th:first-child{width:56%}.report table.chk th:nth-child(2){width:52px}
.report .st{font-weight:700;text-align:center;width:44px}
.report .st.C{color:var(--ok)} .report .st.NC{color:var(--nc)} .report .st.SO{color:#555}
.report .phs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.report .phs img{width:150px;height:112px;object-fit:cover;border:1px solid #999}
.report .sig{height:90px;border:1px solid #999;display:flex;align-items:center;justify-content:center}
.report .sig img{max-height:86px;max-width:100%}
.report .concl{font-size:15px;font-weight:800;padding:8px;border:2px solid #000;text-align:center;margin:6px 0}
.report .pb{page-break-before:always;break-before:page}
.report .small{font-size:11px;color:#444}
.report .box{display:inline-block;width:14px;height:14px;border:1px solid #000;vertical-align:-2px;margin-right:6px;text-align:center;line-height:12px;font-size:12px;font-weight:800}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header.top,.noprint,.bottombar,.banner,.toast{display:none!important}
  main{padding:0;max-width:none}
  .report{border:0;padding:0;max-width:none}
  .report h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .report tr,.report .phs img{break-inside:avoid}
}
</style>
</head>

/* =====================================================================
   Stockage local (IndexedDB, repli en mémoire)
   ===================================================================== */
const DB = (()=>{
  let db=null; const mem={machines:{},vgps:{},kv:{}};
  function open(){
    return new Promise(res=>{
      try{
        const rq=indexedDB.open("vgp-engins",1);
        rq.onupgradeneeded=()=>{const d=rq.result;["machines","vgps","kv"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s);});};
        rq.onsuccess=()=>{db=rq.result;res(true);};
        rq.onerror=()=>res(false);
      }catch(e){res(false);}
    });
  }
  function all(store){
    if(!db) return Promise.resolve(Object.values(mem[store]));
    return new Promise(res=>{try{const rq=db.transaction(store).objectStore(store).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);}catch(e){res([]);}});
  }
  function get(store,key){
    if(!db) return Promise.resolve(mem[store][key]);
    return new Promise(res=>{try{const rq=db.transaction(store).objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined);}catch(e){res(undefined);}});
  }
  function put(store,key,val){
    if(!db){mem[store][key]=val;return Promise.resolve();}
    return new Promise(res=>{try{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>{toast("Erreur d'enregistrement");res();};}catch(e){res();}});
  }
  function del(store,key){
    if(!db){delete mem[store][key];return Promise.resolve();}
    return new Promise(res=>{try{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});
  }
  return {open,all,get,put,del,persistent:()=>!!db};
})();

function addMonths(ds,n){ if(!ds) return ""; const [y,m,d]=ds.split("-").map(Number); const dt=new Date(y,m-1+n,d); if(dt.getDate()!==d) dt.setDate(0); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
const fr=ds=>{ if(!ds) return "—"; const [y,m,d]=ds.split("-"); return d+"/"+m+"/"+y; };
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const num=v=>{ if(v===""||v==null) return NaN; return parseFloat(String(v).replace(",",".")); };

function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split(".");let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};c=c[ks[i]];}c[ks[ks.length-1]]=v;}

function readImage(file,max,type,q){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,w,h);}x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL(type,q));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});
}
function downloadJson(obj,name){
  const blob=new Blob([JSON.stringify(obj)],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast(inFrame?"Téléchargement indisponible dans l'aperçu":"Fichier exporté");
}
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"export";
function exportPack(machines,vgps,name){
  const cids=new Set(machines.map(m=>m.clientId).filter(Boolean));
  downloadJson({app:"vgp-engins",version:2,exportedAt:new Date().toISOString(),clients:S.clients.filter(c=>cids.has(c.id)),machines,vgps},name);
}

/* Statut d'un engin */
function machineStatus(m){
  const done=S.vgps.filter(v=>v.machineId===m.id&&v.status==="terminee").sort((a,b)=>b.date.localeCompare(a.date));
  const draft=S.vgps.find(v=>v.machineId===m.id&&v.status!=="terminee");
  if(!done.length) return {code:"jamais",label:"Aucune VGP",due:null,last:null,draft};
  const last=done[0];
  const due=last.prochaine||addMonths(last.date,periodFor(m));
  const d=daysBetween(today(),due);
  let code="ok",label="À jour – prochaine le "+fr(due);
  if(d<0){code="retard";label="En retard depuis le "+fr(due);}
  else if(d<=30){code="bientot";label="À faire avant le "+fr(due);}
  return {code,label,due,last,draft,inapte:last.conclusion==="inapte"};
}

function secStats(v,secId){
  const items=SECTIONS[secId].items; let done=0,nc=0;
  items.forEach(it=>{const a=v.answers[secId+"."+it[0]];if(a?.s){done++;if(a.s==="NC")nc++;}});
  return {done,nc,total:items.length};
}
function allStats(v){
  const m=v.machine; let done=0,total=0,nc=0,ncNoObs=0;
  sectionsFor(m).forEach(sid=>SECTIONS[sid].items.forEach(it=>{total++;const a=v.answers[sid+"."+it[0]];if(a?.s){done++;if(a.s==="NC"){nc++;if(!a.obs)ncNoObs++;}}}));
  return {done,total,nc,ncNoObs};
}

let photoTarget=null;
function onVgpInput(e){
  const v=V(S.vid); if(!v||S.view!=="vgp") return; const t=e.target;
  if(t.dataset.v!=null){ setPath(v,t.dataset.v,t.value); saveLater("vgps",v);
    if(t.dataset.v.startsWith("essais.")) updateEssaisCalc(v);
    if(t.dataset.v==="date"&&!v.prochaineManuelle){ renderConclusion(v); }
    if(t.dataset.v.startsWith("verif.")){ S.settings.verif=JSON.parse(JSON.stringify(v.verif)); DB.put("kv","settings",S.settings);} }
  if(t.dataset.obsin!=null){ const k=t.closest(".item").dataset.key; v.answers[k]=v.answers[k]||{}; v.answers[k].obs=t.value; saveLater("vgps",v);
    const aux=t.closest(".item").querySelector("[data-obs]"); if(aux) aux.textContent=t.value?"Observation ✓":"+ Observation"; updateNav(v); }
}
function onVgpClick(e){
  const v=V(S.vid); if(!v||S.view!=="vgp"||v.status==="terminee") return;
  const b=e.target.closest("button"); if(!b) return;
  const itemEl=b.closest(".item");
  if(itemEl&&(b.dataset.st||b.dataset.obs!=null||b.dataset.photo!=null||b.dataset.delph!=null)){
    const k=itemEl.dataset.key; const a=v.answers[k]=v.answers[k]||{};
    if(b.dataset.st){ a.s=a.s===b.dataset.st?undefined:b.dataset.st; }
    else if(b.dataset.obs!=null){ a.showObs=true; }
    else if(b.dataset.photo!=null){ photoTarget=k; document.getElementById("photoIn").click(); return; }
    else if(b.dataset.delph!=null){ a.photos.splice(+b.dataset.delph,1); }
    saveLater("vgps",v);
    const [sid,iid]=k.split("."); const it=SECTIONS[sid].items.find(x=>x[0]===iid);
    itemEl.outerHTML=itemHtml(v,sid,it);
    if(b.dataset.obs!=null||(b.dataset.st==="NC"&&a.s==="NC")){ const ta=document.querySelector(`.item[data-key="${k}"] textarea`); if(ta) ta.focus(); }
    updateNav(v); refreshConclusionStats(v);
    return;
  }
  if(b.dataset.addrow!=null){ v.essais.rows.push({pos:"axe",lame:"",portee:"",hauteur:"",tab:"",mvt:"",stab:"",obs:""}); saveLater("vgps",v); rerenderEssais(v); }
  if(b.dataset.delrow!=null){ v.essais.rows.splice(+b.dataset.delrow,1); saveLater("vgps",v); rerenderEssais(v); }
}
function onPhoto(e){
  const f=e.target.files[0]; e.target.value=""; if(!f||!photoTarget) return;
  const v=V(S.vid); const k=photoTarget;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{ const max=1280; let w=img.width,h=img.height; if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
    const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    const data=c.toDataURL("image/jpeg",0.72); URL.revokeObjectURL(url);
    const a=v.answers[k]=v.answers[k]||{}; (a.photos=a.photos||[]).push(data); saveNow("vgps",v);
    const [sid,iid]=k.split("."); const it=SECTIONS[sid].items.find(x=>x[0]===iid);
    const el=document.querySelector(`.item[data-key="${k}"]`); if(el) el.outerHTML=itemHtml(v,sid,it); toast("Photo ajoutée"); };
  img.onerror=()=>toast("Image illisible");
  img.src=url;
}
function updateNav(v){
  sectionsFor(v.machine).forEach(sid=>{const st=secStats(v,sid);const a=document.getElementById("nav-sec-"+sid);if(!a)return;a.classList.toggle("done",st.done===st.total&&!st.nc);a.classList.toggle("hasnc",st.nc>0);});

}

function essaisHtml(v){ return `<div class="card" id="sec-essais">${essaisInner(v)}</div>`; }

    <td>${i+1}</td>
    <td><select data-v="essais.rows.${i}.pos"><option value="axe" ${r.pos==="axe"?"selected":""}>Dans l'axe</option><option value="travers" ${r.pos==="travers"?"selected":""}>En travers</option><option value="360" ${r.pos==="360"?"selected":""}>360°</option></select></td>
    <td><select data-v="essais.rows.${i}.lame"><option value=""></option><option value="baissee" ${r.lame==="baissee"?"selected":""}>Baissée</option><option value="levee" ${r.lame==="levee"?"selected":""}>Levée</option><option value="so" ${r.lame==="so"?"selected":""}>SO</option></select></td>
    <td><input inputmode="decimal" data-v="essais.rows.${i}.portee" value="${esc(r.portee)}"></td>

function rerenderEssais(v){ const el=document.getElementById("sec-essais"); el.innerHTML=essaisInner(v); updateEssaisCalc(v); refreshConclusionStats(v); }
function essaisEval(v){
  const e=v.essais; const tot=num(e.charge)+(isNaN(num(e.accessoires))?0:num(e.accessoires));
  const rows=e.rows.map(r=>{const tab=num(r.tab);const ratio=tot/tab;let cls="",txt="—";
    if(isFinite(ratio)&&tab>0){txt=fmt(ratio,2); if(ratio>1.1){cls="nc";txt+=" – surcharge !";} else if(ratio<0.9){cls="warn";txt+=" – sous la charge nominale";} else cls="ok";}
    const fail=r.mvt==="non"||r.stab==="non"||ratio>1.1; return {ratio,cls,txt,fail};});
  const at=num(e.alarme.tab), ar=tot/at; let al={txt:"",cls:"",ok:null};
  if(isFinite(ar)&&at>0){ if(ar>1&&ar<=1.1){al={txt:"Déclenchement conforme (rapport "+fmt(ar,2)+")",cls:"ok",ok:true};} else if(ar<=1){al={txt:"Déclenchement avant la charge du tableau (rapport "+fmt(ar,2)+") : vérifier le réglage",cls:"warn",ok:false};} else {al={txt:"Déclenchement trop tardif (rapport "+fmt(ar,2)+" > 1,1) : non conforme",cls:"nc",ok:false};} }
  if(e.alarme.visuel==="non"||e.alarme.coupure==="non") al.ok=false;
  const d=num(e.clapets.descente), mx=num(e.clapets.maxi); let cp={txt:"",ok:null};
  if(isFinite(d)&&isFinite(mx)) cp=d<=mx?{txt:"Conforme ("+fmt(d,0)+" mm ≤ "+fmt(mx,0)+" mm)",ok:true}:{txt:"Non conforme ("+fmt(d,0)+" mm > "+fmt(mx,0)+" mm)",ok:false};
  if(e.clapets.a==="non"||e.clapets.b==="non") cp.ok=false;
  return {tot,rows,al,cp};
}
function updateEssaisCalc(v){
  if(!v.machine.levage) return; const r=essaisEval(v);
  const t=document.getElementById("totCharge"); if(t) t.value=isFinite(r.tot)?fmt(r.tot,1)+" kg":"";
  r.rows.forEach((x,i)=>{const c=document.querySelector(`[data-ratio="${i}"]`); if(c){c.textContent=x.txt;c.className="calc "+x.cls;}});
  const ar=document.getElementById("alarmeRatio"); const at=num(v.essais.alarme.tab); if(ar) ar.value=isFinite(r.tot/at)&&at>0?fmt(r.tot/at,2):"";
  const av=document.getElementById("alarmeVerdict"); if(av){av.textContent=r.al.txt;av.className="calc "+r.al.cls;}
  const cv=document.getElementById("clapetVerdict"); if(cv) cv.value=r.cp.txt;
  refreshConclusionStats(v);
}

/* ---------- Conclusion et signatures ---------- */
function ncList(v){
  const out=[]; sectionsFor(v.machine).forEach(sid=>SECTIONS[sid].items.forEach(it=>{const a=v.answers[sid+"."+it[0]];if(a?.s==="NC")out.push({sec:SECTIONS[sid].title,label:it[1],obs:a.obs||""});}));
  if(v.machine.levage){ const r=essaisEval(v);
    r.rows.forEach((x,i)=>{if(x.fail)out.push({sec:"Essais en charge",label:"Essai n° "+(i+1),obs:v.essais.rows[i].obs||""});});
    if(r.al.ok===false) out.push({sec:"Essais en charge",label:"Avertisseur / limiteur de surcharge",obs:r.al.txt||v.essais.alarme.obs});
    if(r.cp.ok===false) out.push({sec:"Essais en charge",label:"Maintien de la charge (clapets)",obs:r.cp.txt||v.essais.clapets.obs}); }
  return out;
}
function refreshConclusionStats(v){ const el=document.getElementById("conclStats"); if(el) el.innerHTML=conclStatsHtml(v); }
function conclStatsHtml(v){
  const s=allStats(v), nc=ncList(v);
  const missing=s.total-s.done;
  return `<div class="row">${missing?`<span class="badge b-bientot">${missing} point(s) non renseigné(s)</span>`:`<span class="badge b-ok">Tous les points sont renseignés</span>`}
    ${nc.length?`<span class="badge b-retard">${nc.length} non-conformité(s)</span>`:`<span class="badge b-ok">Aucune non-conformité</span>`}
    ${s.ncNoObs?`<span class="badge b-retard">${s.ncNoObs} NC sans observation</span>`:""}</div>
    ${nc.length?`<ul style="margin:8px 0 0;padding-left:20px">${nc.map(n=>`<li><b>${esc(n.label)}</b> <span class="ref">(${esc(n.sec)})</span>${n.obs?" – "+esc(n.obs):""}</li>`).join("")}</ul>`:""}`;
}
function renderConclusion(v){
  const el=document.getElementById("sec-concl"); const m=v.machine;
  const auto=addMonths(v.date,periodFor(m));
  if(!v.prochaineManuelle) v.prochaine=auto;
  el.innerHTML=`
    <h2>Conclusion</h2>
    <div id="conclStats">${conclStatsHtml(v)}</div>
    <div class="radio-big" style="margin-top:14px">
      ${[["apte","Apte","Aucun défaut de nature à créer un danger."],["reserves","Apte avec réserves","Défauts à corriger dans les délais indiqués."],["inapte","Inapte","Utilisation interdite jusqu'à correction et nouvelle vérification."]].map(([k,t,d])=>`
      <label class="${v.conclusion===k?"sel-"+k:""}"><input type="radio" name="concl" value="${k}" ${v.conclusion===k?"checked":""}><span><b>${t}</b><br><span class="ref">${d}</span></span></label>`).join("")}
    </div>
    <h3 style="margin-top:16px">Réserves et délais de correction</h3>
    <div id="resList">${resHtml(v)}</div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn small" id="addRes">+ Ajouter une réserve</button><button type="button" class="btn small" id="fillRes">Reprendre les non-conformités</button></div>
    <div class="grid2" style="margin-top:16px">
      <label class="f">Prochaine VGP au plus tard le (${periodFor(m)} mois)<input type="date" id="prochaine" value="${esc(v.prochaine)}"></label>
      <label class="f">Nom et qualité du chef d'établissement ou de son représentant<input data-v="chefNom" value="${esc(v.chefNom)}"></label>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div><div class="ref">Signature du vérificateur</div><div class="sigwrap"><canvas id="sigVerif"></canvas><div class="ph" id="ph_sigVerif">Signer ici</div></div><button type="button" class="btn small" data-clear="sigVerif" style="margin-top:6px">Effacer</button></div>
      <div><div class="ref">Signature du chef d'établissement (prise de connaissance)</div><div class="sigwrap"><canvas id="sigChef"></canvas><div class="ph" id="ph_sigChef">Signer ici</div></div><button type="button" class="btn small" data-clear="sigChef" style="margin-top:6px">Effacer</button></div>
    </div>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn primary" id="finish">Terminer la VGP</button></div>`;
  el.querySelectorAll('input[name="concl"]').forEach(r=>r.onchange=()=>{v.conclusion=r.value;saveLater("vgps",v);el.querySelectorAll(".radio-big label").forEach(l=>{const i=l.querySelector("input");l.className=i.checked?"sel-"+i.value:"";});});
  document.getElementById("prochaine").onchange=e=>{v.prochaine=e.target.value;v.prochaineManuelle=true;saveLater("vgps",v);};
  document.getElementById("addRes").onclick=()=>{v.reserves.push({texte:"",delai:""});saveLater("vgps",v);document.getElementById("resList").innerHTML=resHtml(v);};
  document.getElementById("fillRes").onclick=()=>{const ex=new Set(v.reserves.map(r=>r.texte));ncList(v).forEach(n=>{const t=n.label+(n.obs?" : "+n.obs:"");if(!ex.has(t))v.reserves.push({texte:t,delai:""});});saveLater("vgps",v);document.getElementById("resList").innerHTML=resHtml(v);};
  el.onclick=e=>{const b=e.target.closest("[data-delres]");if(b){v.reserves.splice(+b.dataset.delres,1);saveLater("vgps",v);document.getElementById("resList").innerHTML=resHtml(v);}
    const c=e.target.closest("[data-clear]");if(c){v[c.dataset.clear]="";saveLater("vgps",v);initSig(v,c.dataset.clear);}};
  el.oninput=e=>{const t=e.target;if(t.dataset.res!=null){const [i,f]=t.dataset.res.split(".");v.reserves[+i][f]=t.value;saveLater("vgps",v);}};
  document.getElementById("finish").onclick=()=>finishVgp(v);
  initSig(v,"sigVerif"); initSig(v,"sigChef");
  updateEssaisCalc(v);
}
function resHtml(v){
  if(!v.reserves.length) return `<div class="hint">Aucune réserve.</div>`;
  return v.reserves.map((r,i)=>`<div class="row" style="margin-bottom:8px"><input class="search" data-res="${i}.texte" value="${esc(r.texte)}" placeholder="Réserve"><input class="search" style="flex:0 1 200px;min-width:140px" data-res="${i}.delai" value="${esc(r.delai)}" placeholder="Délai (ex. 15 jours)"><button type="button" class="btn small danger" data-delres="${i}">×</button></div>`).join("");
}
function initSig(v,key){
  const c=document.getElementById(key); if(!c) return;
  const ph=document.getElementById("ph_"+key);
  const ratio=window.devicePixelRatio||1; const rect=c.getBoundingClientRect();
  c.width=Math.max(300,rect.width)*ratio; c.height=180*ratio;
  const ctx=c.getContext("2d"); ctx.scale(ratio,ratio); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111";
  ph.style.display=v[key]?"none":"";
  if(v[key]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width/ratio,c.height/ratio);im.src=v[key];}
  let drawing=false,last=null;
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{if(v.status==="terminee")return;drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);ph.style.display="none";};
  c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;};
  c.onpointerup=c.onpointercancel=()=>{if(!drawing)return;drawing=false;v[key]=c.toDataURL("image/png");saveLater("vgps",v);};
}
async function finishVgp(v){
  const s=allStats(v);
  if(!v.date){toast("Indiquez la date de la vérification");return;}
  if(!v.verif?.nom){toast("Indiquez le nom du vérificateur");document.querySelector('[data-v="verif.nom"]').focus();return;}
  if(!v.conclusion){toast("Choisissez la conclusion");return;}
  if(s.ncNoObs){toast("Décrivez chaque non-conformité dans son observation");return;}
  if(!v.sigVerif){toast("La signature du vérificateur est nécessaire");return;}
  if(s.done<s.total && !await confirmBox(`${s.total-s.done} point(s) ne sont pas renseignés. Terminer quand même ?`,"Terminer",false)) return;
  if(ncList(v).length&&v.conclusion==="apte"&&!await confirmBox("Des non-conformités sont relevées mais la conclusion est « Apte ». Confirmer ?","Confirmer",false)) return;
  v.status="terminee"; v.finishedAt=Date.now(); await saveNow("vgps",v);
  toast("VGP terminée"); go("report",{vid:v.id});
}

      <button class="btn small" id="logoBtn">${o.logo?"Changer le logo":"Ajouter un logo"}</button>
      ${o.logo?`<button class="btn small danger" id="logoDel">Retirer</button>`:""}
      <input type="file" id="logoIn" accept="image/*" style="display:none">
    </div></div>
  <div class="card"><h2>Vérificateur par défaut</h2>
    <div class="grid2">
      <label class="f">Nom et prénom<input id="v_nom" value="${esc(vf.nom)}"></label>
      <label class="f">Fonction<input id="v_fct" value="${esc(vf.fonction)}"></label>
      <label class="f">Société / organisme<input id="v_soc" value="${esc(vf.societe)}"></label>
      <label class="f">Statut<select id="v_st"><option value="interne" ${vf.statut!=="externe"?"selected":""}>Salarié de l'entreprise utilisatrice</option><option value="externe" ${vf.statut==="externe"?"selected":""}>Organisme ou société extérieure</option></select></label>
      <label class="f" style="grid-column:1/-1">Justificatifs de qualification<input id="v_q" value="${esc(vf.qualif)}"></label>
    </div></div>
  <div class="row" style="justify-content:flex-end;margin:-4px 0 14px"><button class="btn primary" id="saveS">Enregistrer la structure et le vérificateur</button></div>
  <div class="card"><h2>Clients (entreprises utilisatrices)</h2>
    ${S.clients.length?`<table class="t"><tr><th>Nom</th><th>Adresse</th><th>Contact</th><th style="width:70px">Engins</th><th style="width:60px"></th></tr>
    ${S.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>`<tr><td><input data-cl="${c.id}.nom" value="${esc(c.nom)}"></td><td><input data-cl="${c.id}.adresse" value="${esc(c.adresse)}"></td><td><input data-cl="${c.id}.contact" value="${esc(c.contact)}" placeholder="Nom, téléphone"></td><td>${used(c.id)}</td><td>${used(c.id)?"":`<button class="btn small danger" data-delcl="${c.id}">×</button>`}</td></tr>`).join("")}</table>`:`<p class="hint">Aucun client. Si vous faites les VGP de votre propre parc, créez un seul client : votre entreprise.</p>`}
    <div class="row" style="margin-top:10px"><input class="search" id="nc_nom" placeholder="Nom du nouveau client"><input class="search" id="nc_adr" placeholder="Adresse"><button class="btn" id="addCl">+ Ajouter</button></div></div>
  <div class="card"><h2>Sauvegarde et échange de données</h2>
    <p class="hint">Les données sont enregistrées uniquement sur cette tablette. Exportez régulièrement une sauvegarde complète et gardez-la ailleurs (clé USB, e-mail, cloud). Pour échanger avec un client ou un vérificateur, exportez seulement son parc (filtre client sur l'écran Parc) ou une seule VGP (depuis son rapport) : l'autre personne l'importe ici.</p>
    <div class="row"><button class="btn dark" id="exp">Exporter une sauvegarde complète</button><button class="btn" id="imp">Importer un fichier</button><input type="file" id="impIn" accept="application/json,.json" style="display:none"></div>
    <p class="ref" style="margin-top:10px">${S.clients.length} client(s), ${S.machines.length} engin(s), ${S.vgps.length} VGP enregistrée(s).</p></div>
  <div class="card"><h2>À propos et conditions d'utilisation</h2><p class="hint">${esc(DISCLAIMER)}</p><p class="hint">Périodicités : 12 mois pour les machines mobiles de terrassement à conducteur porté (arrêté du 5 mars 1993) ; 6 mois si l'engin est équipé pour le levage (arrêté du 1er mars 2004).</p></div>`;
  const g=id=>document.getElementById(id).value.trim();
  document.getElementById("saveS").onclick=async()=>{
    Object.assign(S.settings.organisme,{nom:g("o_nom"),adresse:g("o_adr"),tel:g("o_tel")});
    S.settings.verif={nom:g("v_nom"),fonction:g("v_fct"),societe:g("v_soc"),statut:g("v_st"),qualif:g("v_q")};
    await DB.put("kv","settings",S.settings); toast("Réglages enregistrés");
  };
  document.getElementById("logoBtn").onclick=()=>document.getElementById("logoIn").click();
  document.getElementById("logoIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    try{S.settings.organisme.logo=await readImage(f,500,"image/png");}catch(err){toast("Image illisible");return;}
    Object.assign(S.settings.organisme,{nom:g("o_nom"),adresse:g("o_adr"),tel:g("o_tel")});
    await DB.put("kv","settings",S.settings);toast("Logo enregistré");renderSettings();};
  const ld=document.getElementById("logoDel"); if(ld) ld.onclick=async()=>{S.settings.organisme.logo="";await DB.put("kv","settings",S.settings);renderSettings();};
  app.oninput=e=>{const t=e.target;if(t.dataset.cl){const [id,f]=t.dataset.cl.split(".");const c=CL(id);if(c){c[f]=t.value;clearTimeout(saveTimers.cl);saveTimers.cl=setTimeout(saveClients,400);}}};
  app.onclick=async e=>{const b=e.target.closest("[data-delcl]");if(!b)return;const c=CL(b.dataset.delcl);
    if(!await confirmBox(`Supprimer le client « ${c.nom} » ?`,"Supprimer"))return;S.clients=S.clients.filter(x=>x.id!==c.id);await saveClients();renderSettings();};
  document.getElementById("addCl").onclick=async()=>{const nom=g("nc_nom");if(!nom){toast("Indiquez le nom du client");return;}
    S.clients.push({id:uid(),nom,adresse:g("nc_adr"),contact:""});await saveClients();toast("Client ajouté");renderSettings();};
  document.getElementById("exp").onclick=()=>downloadJson({app:"vgp-engins",version:2,exportedAt:new Date().toISOString(),settings:S.settings,clients:S.clients,machines:S.machines,vgps:S.vgps},"sauvegarde-vgp-"+today()+".json");
  document.getElementById("imp").onclick=()=>document.getElementById("impIn").click();
  document.getElementById("impIn").onchange=async e=>{
    const f=e.target.files[0]; e.target.value=""; if(!f) return;
    let d; try{d=JSON.parse(await f.text());}catch(err){toast("Fichier illisible");return;}
    if(d.app!=="vgp-engins"||!Array.isArray(d.machines)){toast("Ce fichier n'est pas un fichier VGP Engins");return;}
    const cl=d.clients||[], vg=d.vgps||[];
    if(!await confirmBox(`Importer ${cl.length} client(s), ${d.machines.length} engin(s) et ${vg.length} VGP ? Les éléments déjà présents avec le même identifiant seront mis à jour.`,"Importer",false)) return;
    cl.forEach(c=>upsert(S.clients,c)); await saveClients();
    for(const m of d.machines){await DB.put("machines",m.id,m);upsert(S.machines,m);}
    for(const v of vg){await DB.put("vgps",v.id,v);upsert(S.vgps,v);}
    if(d.settings&&!S.settings.organisme.nom&&!S.machines.length){S.settings=Object.assign(S.settings,d.settings);await DB.put("kv","settings",S.settings);}
    toast("Import terminé"); renderSettings();
  };
}

/* =====================================================================
   Démarrage
   ===================================================================== */
(async function start(){
  await DB.open();
  S.machines=await DB.all("machines"); S.vgps=await DB.all("vgps");
  const st=await DB.get("kv","settings"); if(st){ S.settings=Object.assign(S.settings,st); S.settings.organisme=Object.assign({nom:"",adresse:"",tel:"",logo:""},st.organisme||{}); }
  S.clients=(await DB.get("kv","clients"))||[];
  // Reprise des données de la première version : l'entreprise devient un client
  if(!S.clients.length&&S.settings.entreprise?.nom){
    const c={id:uid(),nom:S.settings.entreprise.nom,adresse:S.settings.entreprise.adresse||"",contact:""};
    S.clients.push(c); await saveClients();
    if(!S.settings.organisme.nom){S.settings.organisme.nom=c.nom;S.settings.organisme.adresse=c.adresse;}
    await DB.put("kv","settings",S.settings);
    for(const m of S.machines){ if(!m.clientId){ m.clientId=c.id; await DB.put("machines",m.id,m);} }
  }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  if(!inFrame&&"serviceWorker" in navigator&&location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
</html>
